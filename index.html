<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <meta name="theme-color" content="#0A0A0A">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/jpeg" href="icon.jpeg">
    <script>
        tailwind = { theme: { extend: { colors: { background: '#0A0A0A', surface: '#141414', primary: '#FFFFFF' } } } }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/main.css">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <title>Study.Log</title>
</head>
<body class="spacer-pb">
    <header class="w-full px-6 pt-8 pb-4 max-w-[1600px] mx-auto lg:px-12 flex justify-between items-center lg:hidden">
        <h1 class="text-xl font-bold uppercase tracking-[0.2em] text-white">Study.Log</h1>
    </header>
    <main class="px-4 pt-4 w-full">
        <div class="m3-grid m3-grid-responsive gap-4">
            <!-- Quantity Module -->
            <div class="flex flex-col justify-center py-6 border-b border-white/5 lg:border-b-0 lg:bg-[#141414] lg:p-8 lg:rounded-[18px]">
                <span class="card-title text-gray-500 mb-2">Quantity</span>
                <div class="flex items-baseline gap-2">
                    <input id="questions-input" class="bg-transparent text-white border-0 outline-none kpi-value w-full" type="number" value="0"/>
                    <span class="text-xl lg:text-3xl font-light text-gray-500">qs</span>
                </div>
                <span class="sublabel-text text-gray-600 mt-2">Number of problems to log</span>
            </div>
            
            <!-- Duration Module -->
            <div class="flex flex-col justify-center py-6 border-b border-white/5 lg:border-b-0 lg:bg-[#141414] lg:p-8 lg:rounded-[18px]">
                <span class="card-title text-gray-500 mb-2">Duration</span>
                <div class="flex items-baseline gap-2">
                    <input id="time-input" class="bg-transparent text-white border-0 outline-none kpi-value w-full" type="number" value="0"/>
                    <span class="text-xl lg:text-3xl font-light text-gray-500">min</span>
                </div>
                <span class="sublabel-text text-gray-600 mt-2">Time spent solving</span>
            </div>
 
            <!-- Focus Area & Source Selector Module -->
            <div class="flex flex-col gap-5 py-6 lg:bg-[#141414] lg:p-8 lg:rounded-[18px]">
                <div class="flex flex-col relative w-full">
                    <span class="card-title text-gray-500 mb-2">Focus Area</span>
                    <input id="chapter-input" class="m3-input w-full uppercase tracking-wider py-4 text-base rounded-xl border border-white/5 bg-[#141414] lg:bg-[#1C1C1C]" placeholder="ENTER CHAPTER NAME" type="text" autocomplete="off"/>
                    <div id="chapter-suggestions" class="suggestion-box absolute top-full left-0 w-full hidden"></div>
                </div>
 
                <div class="flex flex-col w-full">
                    <span class="card-title text-gray-500 mb-2">Source Material</span>
                    <select id="source-input" class="m3-input w-full cursor-pointer py-4 text-base rounded-xl border border-white/5 bg-[#141414] lg:bg-[#1C1C1C]">
                        <option value="module" class="bg-[#141414] text-white">Module</option>
                        <option value="pathfinder" class="bg-[#141414] text-white">Pathfinder</option>
                        <option value="blackbook" class="bg-[#141414] text-white">Blackbook</option>
                        <option value="kota" class="bg-[#141414] text-white">Kota Material</option>
                        <option value="other" class="bg-[#141414] text-white">Other</option>
                    </select>
                </div>
 
                <div class="pt-2 w-full">
                    <button id="submit-btn" class="m3-btn m3-btn-primary w-full py-4 rounded-xl text-base font-bold">Save Progress</button>
                </div>
            </div>
        </div>
    </main>
 
    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <!-- Logo block (hidden on mobile) -->
        <div class="hidden lg:flex items-center gap-3 mb-8 px-4">
            <span class="text-xl font-bold uppercase tracking-[0.2em] text-white">Study.Log</span>
        </div>

        <button class="nav-item active">
            <span class="material-symbols-outlined">timer</span>
            <span class="nav-label hidden lg:inline">Tracker</span>
        </button>
        <button onclick="window.location.href='practice.html'" class="nav-item">
            <span class="material-symbols-outlined">shuffle</span>
            <span class="nav-label hidden lg:inline">Practice</span>
        </button>
        <button onclick="window.location.href='stats.html'" class="nav-item">
            <span class="material-symbols-outlined">bar_chart</span>
            <span class="nav-label hidden lg:inline">Performance</span>
        </button>
        <button onclick="window.location.href='settings.html'" class="nav-item">
            <span class="material-symbols-outlined">settings</span>
            <span class="nav-label hidden lg:inline">Settings</span>
        </button>
    </nav>
 
    <div id="toast-container" class="fixed top-6 left-1/2 -translate-x-1/2 z-[100] flex flex-col gap-2"></div>
    
    <!-- Modular JS -->
    <script src="js/storage.js"></script>
    <script src="js/jee_data.js"></script>
    <script src="js/chapter_validator.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
