<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <meta name="theme-color" content="#0A0A0A">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/jpeg" href="icon.jpeg">
    <script>
        tailwind = { theme: { extend: { colors: { background: '#0A0A0A', surface: '#141414', primary: '#FFFFFF' } } } }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/timer.css">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <title>Study.Log</title>
</head>
<body class="spacer-pb">
    <header class="w-full px-6 pt-8 pb-4 max-w-[1600px] mx-auto lg:px-12 flex justify-between items-center lg:hidden">
        <h1 class="text-xl font-bold uppercase tracking-[0.2em] text-white">Study.Log</h1>
    </header>
    <main class="px-4 pt-4 w-full">
        <div class="m3-grid m3-grid-responsive gap-4">
            <!-- Quantity Module -->
            <div class="flex flex-col justify-center py-6 border-b border-white/5 lg:border-b-0 lg:bg-[#141414] lg:p-8 lg:rounded-[18px]">
                <span class="card-title text-gray-500 mb-2">Quantity</span>
                <div class="flex items-baseline gap-2">
                    <input id="questions-input" class="bg-transparent text-white border-0 outline-none kpi-value w-full" type="number" value="0"/>
                    <span class="text-xl lg:text-3xl font-light text-gray-500">qs</span>
                </div>
                <span class="sublabel-text text-gray-600 mt-2">Number of problems to log</span>
            </div>
            
            <!-- Duration Module -->
            <div class="flex flex-col justify-center py-6 border-b border-white/5 lg:border-b-0 lg:bg-[#141414] lg:p-8 lg:rounded-[18px]">
                <span class="card-title text-gray-500 mb-2">Duration</span>
                <div class="flex items-baseline gap-2">
                    <input id="time-input" class="bg-transparent text-white border-0 outline-none kpi-value w-full" type="number" value="0"/>
                    <span class="text-xl lg:text-3xl font-light text-gray-500">min</span>
                </div>
                <span class="sublabel-text text-gray-600 mt-2">Time spent solving</span>
            </div>
 
            <!-- Focus Area & Source Selector Module -->
            <div class="flex flex-col gap-5 py-6 lg:bg-[#141414] lg:p-8 lg:rounded-[18px]">
                <div class="flex flex-col relative w-full">
                    <span class="card-title text-gray-500 mb-2">Focus Area</span>
                    <input id="chapter-input" class="m3-input w-full uppercase tracking-wider py-4 text-base rounded-xl border border-white/5 bg-[#141414] lg:bg-[#1C1C1C]" placeholder="ENTER CHAPTER NAME" type="text" autocomplete="off"/>
                    <div id="chapter-suggestions" class="suggestion-box absolute top-full left-0 w-full hidden"></div>
                </div>
 
                <div class="flex flex-col w-full">
                    <span class="card-title text-gray-500 mb-2">Difficulty Level</span>
                    <select id="level-input" class="m3-input w-full cursor-pointer py-4 text-base rounded-xl border border-white/5 bg-[#141414] lg:bg-[#1C1C1C]">
                        <option value="mains" class="bg-[#141414] text-white">JEE Mains</option>
                        <option value="advanced" class="bg-[#141414] text-white">JEE Advanced</option>
                    </select>
                </div>
 
                <div class="flex flex-col relative w-full">
                    <span class="card-title text-gray-500 mb-2">Source Material</span>
                    <input id="source-input" class="m3-input w-full uppercase tracking-wider py-4 text-base rounded-xl border border-white/5 bg-[#141414] lg:bg-[#1C1C1C]" placeholder="ENTER SOURCE MATERIAL" type="text" autocomplete="off"/>
                    <div id="source-suggestions" class="suggestion-box absolute top-full left-0 w-full hidden z-[1000]"></div>
                </div>
 
                <div class="pt-2 w-full">
                    <button id="submit-btn" class="m3-btn m3-btn-primary w-full py-4 rounded-xl text-base font-bold">Save Progress</button>
                </div>
            </div>
        </div>

        <!-- Standalone Material 3 Expressive Timer -->
        <div class="timer-card mt-6 w-full max-w-[400px] md:max-w-[850px] mx-auto">
            <h3 class="text-xs uppercase tracking-widest text-gray-400 font-bold mb-6 text-left">Focus Timer</h3>
            <div class="flex flex-col md:flex-row items-center justify-around gap-8 md:gap-12 py-2">
                <!-- SVG Progress Clock Dial -->
                <div class="relative w-64 h-64 flex items-center justify-center">
                    <svg class="timer-svg w-64 h-64 transform -rotate-90" viewBox="0 0 200 200">
                        <circle cx="100" cy="100" r="80" class="timer-track" />
                        <circle cx="100" cy="100" r="80" class="timer-progress" />
                    </svg>
                    <div class="absolute flex flex-col items-center justify-center mt-2">
                        <span id="timer-display" class="text-[72px] leading-none font-black text-white tracking-tight">25:00</span>
                        <span id="timer-status" class="text-xs uppercase tracking-[0.1em] text-[#AAFF00] font-bold mt-2">IDLE</span>
                    </div>
                </div>

                <!-- Controls & Adjustments Grid -->
                <div class="flex flex-col gap-5 w-full max-w-sm">
                    <div class="flex flex-col gap-2 timer-section-toggle">
                        <span class="text-[10px] text-gray-500 uppercase tracking-widest font-black">Quick Presets</span>
                        <div class="grid grid-cols-2 gap-3">
                            <span class="preset-btn text-center cursor-pointer active-preset" data-time="1500">25M</span>
                            <span class="preset-btn text-center cursor-pointer" data-time="2700">45M</span>
                            <span class="preset-btn text-center cursor-pointer" data-time="3600">60M</span>
                            <span class="preset-btn text-center cursor-pointer" data-time="300">5M</span>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-4 timer-section-toggle">
                        <div class="flex flex-col gap-2">
                            <span class="text-[10px] text-gray-500 uppercase tracking-widest font-black">Adjust</span>
                            <div class="flex items-center gap-3">
                                <span id="timer-add-min" class="adjust-btn text-center flex-1 cursor-pointer">+1m</span>
                                <span id="timer-sub-min" class="adjust-btn text-center flex-1 cursor-pointer">-1m</span>
                            </div>
                        </div>
                        <div class="flex flex-col gap-2">
                            <span class="text-[10px] text-gray-500 uppercase tracking-widest font-black">Set Custom</span>
                            <div class="flex flex-col justify-between h-full gap-2 mt-1">
                                <span id="custom-minutes-label" class="text-3xl text-white font-bold leading-none uppercase">25 MINS</span>
                                <input id="timer-custom-slider" type="range" min="1" max="180" value="25" class="w-full h-4 bg-transparent appearance-none cursor-pointer mt-1"/>
                            </div>
                        </div>
                    </div>

                    <div class="timer-controls-row flex items-center justify-start gap-4 mt-4">
                        <span id="timer-reset" class="control-btn-sec flex items-center justify-center w-12 h-12 cursor-pointer">
                            <span class="material-symbols-outlined select-none">restart_alt</span>
                        </span>
                        
                        <span id="timer-toggle" class="control-btn-pri flex items-center justify-center w-20 h-16 cursor-pointer">
                            <span class="material-symbols-outlined text-4xl font-bold select-none text-black">play_arrow</span>
                        </span>

                        <span id="timer-sound-toggle" class="control-btn-sec flex items-center justify-center w-12 h-12 cursor-pointer">
                            <span class="material-symbols-outlined select-none">volume_up</span>
                        </span>
                    </div>
                </div>
            </div>
        </div>
    </main>
 
    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <!-- Logo block (hidden on mobile) -->
        <div class="hidden lg:flex items-center gap-3 mb-8 px-4">
            <span class="text-xl font-bold uppercase tracking-[0.2em] text-white">Study.Log</span>
        </div>

        <button class="nav-item active">
            <span class="material-symbols-outlined">timer</span>
            <span class="nav-label hidden lg:inline">Tracker</span>
        </button>
        <button onclick="window.location.href='practice.html'" class="nav-item">
            <span class="material-symbols-outlined">shuffle</span>
            <span class="nav-label hidden lg:inline">Practice</span>
        </button>
        <button onclick="window.location.href='stats.html'" class="nav-item">
            <span class="material-symbols-outlined">bar_chart</span>
            <span class="nav-label hidden lg:inline">Performance</span>
        </button>
        <button onclick="window.location.href='settings.html'" class="nav-item">
            <span class="material-symbols-outlined">settings</span>
            <span class="nav-label hidden lg:inline">Settings</span>
        </button>
    </nav>
 
    <div id="toast-container" class="fixed top-6 left-1/2 -translate-x-1/2 z-[100] flex flex-col gap-2"></div>
    
    <!-- Modular JS -->
    <script src="js/storage.js"></script>
    <script src="js/jee_data.js"></script>
    <script src="js/chapter_validator.js"></script>
    <script src="js/timer.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
